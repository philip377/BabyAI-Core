[project]
name = "babyai-core"
version = "0.1.0"
description = "Local-first portable personal AI core engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
babyai = "babyai.cli:app"
babyai-evidence = "babyai.evidence_cli:app"
babyai-learn = "babyai.learn_cli:app"
babyai-curiosa = "babyai.curiosa_cli:app"
babyai-loop = "babyai.learning_loop_cli:app"
babyai-setup = "babyai.setup_cli:app"
babyai-desktop-bridge = "babyai.desktop_bridge_cli:app"
babyai-desktop = "babyai.desktop_commands_cli:app"
babyai-workspace = "babyai.workspace_cli:app"
babyai-retrieval = "babyai.workspace_retrieval_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babyai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
