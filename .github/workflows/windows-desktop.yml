name: Windows Desktop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install BabyAI Core
        shell: pwsh
        run: python -m pip install -e .
      - name: Verify desktop bridge
        shell: pwsh
        env:
          BABYAI_PROVIDER: echo
        run: |
          babyai-setup init
          babyai-desktop exec status
      - name: Build WinUI Desktop
        shell: pwsh
        run: dotnet build desktop/BabyAI.Desktop/BabyAI.Desktop.csproj -c Release -p:Platform=x64
