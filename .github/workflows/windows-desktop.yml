name: Windows Desktop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test agent profiles and scoped matching decisions
        shell: pwsh
        run: dotnet run --project tests/AgentProfiles.Smoke/AgentProfiles.Smoke.csproj
      - name: Test Ginger diagnostics subprocess safety
        # Runs only fixed synthetic subprocesses, not a live Ginger session.
        shell: pwsh
        run: dotnet run --project tests/GingerDiagnostics.Smoke/GingerDiagnostics.Smoke.csproj
      - name: Test Ginger chat stages, confirmation, ratings, lessons and cancellation without desktop input
        shell: pwsh
        run: dotnet run --project tests/GingerChat.Smoke/GingerChat.Smoke.csproj
      - name: Test bounded Ginger filter preparation and incomplete observation guards
        shell: pwsh
        run: dotnet run --project tests/GingerDesktopSession.Smoke/GingerDesktopSession.Smoke.csproj -c Release
      - name: Test Ginger driver import preserves explicit confirmation
        shell: powershell
        run: ./tests/ginger-driver-import-smoke.ps1
      - name: Test Ginger semantic navigation on an isolated fixture
        shell: powershell
        run: ./tests/ginger-navigation-smoke.ps1
      - name: Test bounded Ginger search observation without input
        shell: powershell
        run: ./tests/ginger-search-wait-smoke.ps1
      - name: Test Ginger preparation snapshots and post-input reads without desktop access
        shell: powershell
        run: ./tests/ginger-desktop-prepare-smoke.ps1
      - name: Test Ginger filter-only context without desktop access
        shell: powershell
        run: ./tests/ginger-filter-only-context-smoke.ps1
      - name: Test Ginger panel loading without repeating navigation
        shell: powershell
        run: ./tests/ginger-panel-wait-smoke.ps1
      - name: Test tab OCR preprocessing on synthetic images
        shell: powershell
        run: ./tests/ginger-tab-image-smoke.ps1
      - name: Install BabyAI Core package
        shell: pwsh
        run: python -m pip install -e ".[dev]"
      - name: Test bounded filter-only planning without model or desktop input
        shell: pwsh
        run: python -m pytest tests/test_ginger_filter_only.py -q
      - name: Test protected search settings and bounded research without external requests
        shell: pwsh
        run: python -m pytest tests/test_public_search_settings.py tests/test_ginger_bottle_research.py -q
      - name: Test supplier lesson proposals and independent pair verification without desktop input
        shell: pwsh
        run: python -m pytest tests/test_ginger_teacher.py tests/test_ginger_lesson_evidence.py tests/test_ginger_answer_reward.py tests/test_ginger_identity_evidence.py tests/test_ginger_volume_evidence.py tests/test_ginger_marking_evidence.py tests/test_ginger_marking_lessons.py -q
      - name: Test persistent Ginger queue controller guards
        # Uses synthetic files and rejects before live UI access.
        shell: pwsh
        run: python -m pytest tests/test_agents_navigation_wiring.py tests/test_ginger_price_queue.py tests/test_ginger_row_journal.py tests/test_ginger_filter_preflight.py tests/test_ginger_filter_plan.py tests/test_ginger_filter_relaxation.py tests/test_ginger_filter_controller.py tests/test_ginger_row_filter_prepare.py tests/test_ginger_row_review.py tests/test_ginger_review_queue.py tests/test_ginger_batch.py tests/test_ginger_search_session.py tests/test_ginger_candidate_review.py tests/test_ginger_review_report.py tests/test_ginger_review_feedback.py tests/test_ginger_review_form.py tests/test_ginger_product_condition.py tests/test_ginger_variant_evidence.py tests/test_ginger_batch_report.py -q
      - name: Verify desktop bridge
        shell: pwsh
        env:
          BABYAI_PROVIDER: echo
        run: |
          python -m babyai.setup_cli init
          python -m babyai.desktop_commands_cli exec status
      - name: Build runnable WinUI Desktop
        shell: pwsh
        run: dotnet build desktop/BabyAI.Desktop/BabyAI.Desktop.csproj -c Release -p:Platform=x64
      - name: Verify runnable executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/BabyAI.Desktop/bin/x64/Release -Filter BabyAI.Desktop.exe -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "BabyAI.Desktop.exe was not produced." }
          Write-Host "Runnable desktop executable: $($exe.FullName)"
      - name: Compile Ginger driver from packaged application directory
        shell: powershell
        run: |
          $testScript = (Resolve-Path tests/ginger-driver-import-smoke.ps1).Path
          $exe = Get-ChildItem desktop/BabyAI.Desktop/bin/x64/Release -Filter BabyAI.Desktop.exe -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Desktop executable missing' }
          Push-Location $exe.DirectoryName
          try {
            & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -STA -File $testScript
            if ($LASTEXITCODE -ne 0) { throw 'Packaged-directory Ginger compilation failed' }
          } finally { Pop-Location }
      - name: Smoke-test Desktop startup
        shell: pwsh
        env:
          BABYAI_PROVIDER: echo
        run: |
          $exe = Get-ChildItem desktop/BabyAI.Desktop/bin/x64/Release -Filter BabyAI.Desktop.exe -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "BabyAI.Desktop.exe was not produced." }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 4
          if ($process.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "BabyAI\logs\desktop-startup.log"
            if (Test-Path $log) { Get-Content $log }
            throw "BabyAI Desktop exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
      - name: Verify safe diagnostics export
        shell: pwsh
        env:
          BABYAI_PROVIDER: echo
        run: |
          $report = Join-Path $env:RUNNER_TEMP "babyai-diagnostics.txt"
          .\scripts\windows\diagnose.ps1 -Provider echo -OutputPath $report
          if (-not (Test-Path $report)) { throw "Diagnostics report was not produced." }
          $content = Get-Content $report -Raw
          if ($content -notmatch "bridge.ok=true") { throw "Diagnostics report did not confirm the bridge." }
          if ($content -notmatch "privacy_note=") { throw "Diagnostics report is missing its privacy marker." }
      - uses: actions/upload-artifact@v4
        with:
          name: BabyAI-Windows-x64
          path: desktop/BabyAI.Desktop/bin/x64/Release/net10.0-windows10.0.26100.0/
          if-no-files-found: error
