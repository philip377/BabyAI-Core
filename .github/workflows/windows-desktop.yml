name: Windows Desktop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install BabyAI Core
        shell: pwsh
        run: python -m pip install -e .
      - name: Verify desktop bridge
        shell: pwsh
        env:
          BABYAI_PROVIDER: echo
        run: |
          python -m babyai.setup_cli init
          python -m babyai.desktop_commands_cli exec status
      - name: Build runnable WinUI Desktop
        shell: pwsh
        run: dotnet build desktop/BabyAI.Desktop/BabyAI.Desktop.csproj -c Release -p:Platform=x64
      - name: Verify runnable executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/BabyAI.Desktop/bin/x64/Release -Filter BabyAI.Desktop.exe -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "BabyAI.Desktop.exe was not produced." }
          Write-Host "Runnable desktop executable: $($exe.FullName)"
      - name: Smoke-test Desktop startup
        shell: pwsh
        env:
          BABYAI_PROVIDER: echo
        run: |
          $exe = Get-ChildItem desktop/BabyAI.Desktop/bin/x64/Release -Filter BabyAI.Desktop.exe -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw "BabyAI.Desktop.exe was not produced." }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 4
          if ($process.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "BabyAI\logs\desktop-startup.log"
            if (Test-Path $log) { Get-Content $log }
            throw "BabyAI Desktop exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
      - name: Verify safe diagnostics export
        shell: pwsh
        env:
          BABYAI_PROVIDER: echo
        run: |
          $report = Join-Path $env:RUNNER_TEMP "babyai-diagnostics.txt"
          .\scripts\windows\diagnose.ps1 -Provider echo -OutputPath $report
          if (-not (Test-Path $report)) { throw "Diagnostics report was not produced." }
          $content = Get-Content $report -Raw
          if ($content -notmatch "bridge.ok=true") { throw "Diagnostics report did not confirm the bridge." }
          if ($content -notmatch "privacy_note=") { throw "Diagnostics report is missing its privacy marker." }
      - uses: actions/upload-artifact@v4
        with:
          name: BabyAI-Windows-x64
          path: desktop/BabyAI.Desktop/bin/x64/Release/net10.0-windows10.0.26100.0/
          if-no-files-found: error
