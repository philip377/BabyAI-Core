name: Windows Release Bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "scripts/windows/*release*.ps1"
      - "scripts/windows/build-single-exe-installer.ps1"
      - "installer/**"
      - "desktop/**"
      - "src/**"
      - "native/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/windows-release.yml"
      - "scripts/windows/*release*.ps1"
      - "scripts/windows/build-single-exe-installer.ps1"
      - "installer/**"
      - "desktop/**"
      - "src/**"
      - "native/**"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VULKAN_SDK_VERSION: "1.4.350.0"
      VULKAN_SDK_SHA256: "855b27ba05d2d8119c5114c5d4ff870ca38f2c632b11e1bb9923b9b7e6ecfe7b"
      SEVEN_ZIP_LZMA_VERSION: "26.02"
      SEVEN_ZIP_LZMA_SHA256: "2878c85f5f43a4a4e0952b1fd4e5fe097c1c143997a8047c7e1e788892aa9357"
      BABYAI_STT_MODEL_NAME: "sherpa-onnx-whisper-tiny"
      BABYAI_STT_MODEL_SHA256: "c46116994e539aa165266d96b325252728429c12535eb9d8b6a2b10f129e66b1"
      BABYAI_STT_MODEL_SIZE: "116204861"
      BABYAI_STT_MODEL_URL: "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-tiny.tar.bz2"

    steps:
      - name: Checkout BabyAI
        uses: actions/checkout@v4

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: e79e4bf660e19f2ad851e06c6913f7a8c5852621
          path: external/llama.cpp
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve and verify release version
        shell: pwsh
        run: |
          $pyproject = Get-Content pyproject.toml -Raw
          $projectMatch = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $projectMatch.Success) { throw "Could not read project version." }
          $projectVersion = $projectMatch.Groups[1].Value

          $desktop = Get-Content desktop/BabyAI.Desktop/BabyAI.Desktop.csproj -Raw
          $desktopMatch = [regex]::Match($desktop, '<Version>([^<]+)</Version>')
          if (-not $desktopMatch.Success) { throw "Could not read desktop version." }
          $desktopVersion = $desktopMatch.Groups[1].Value
          if ($projectVersion -ne $desktopVersion) {
            throw "Version mismatch: Core=$projectVersion Desktop=$desktopVersion"
          }

          $version = $projectVersion
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v', 'V')
            if ($tagVersion -ne $projectVersion) {
              throw "Tag version $tagVersion does not match project version $projectVersion"
            }
            $version = $tagVersion
          }

          "BABYAI_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BabyAI release version: $version"

      - name: Prepare offline Core wheels
        shell: pwsh
        run: .\scripts\windows\prepare-release-wheels.ps1 -OutputDir release-wheels -Python python

      - name: Prepare self-contained Python runtime
        shell: pwsh
        run: .\scripts\windows\prepare-release-python.ps1 -WheelsDir release-wheels -OutputDir release-python -Python python

      - name: Publish WinUI Desktop
        shell: pwsh
        run: |
          dotnet publish desktop/BabyAI.Desktop/BabyAI.Desktop.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o release-desktop
          if (-not (Test-Path release-desktop/BabyAI.Desktop.exe -PathType Leaf)) {
            throw "BabyAI.Desktop.exe was not produced."
          }

      - name: Bundle pinned local Whisper STT model
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "$env:BABYAI_STT_MODEL_NAME.tar.bz2"
          $extractRoot = Join-Path $env:RUNNER_TEMP "babyai-stt-model"
          Invoke-WebRequest -Uri $env:BABYAI_STT_MODEL_URL -OutFile $archive

          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:BABYAI_STT_MODEL_SHA256) {
            throw "STT model SHA256 mismatch: $actual"
          }
          if ((Get-Item $archive).Length -ne [long]$env:BABYAI_STT_MODEL_SIZE) {
            throw "STT model size mismatch."
          }

          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $extractRoot | Out-Null
          & tar.exe -xjf $archive -C $extractRoot
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the Whisper STT model." }

          $modelRoot = Join-Path $extractRoot $env:BABYAI_STT_MODEL_NAME
          $requiredFiles = @("tiny-encoder.int8.onnx", "tiny-decoder.int8.onnx", "tiny-tokens.txt")
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path $modelRoot $file) -PathType Leaf)) {
              throw "Extracted STT model is incomplete: missing $file"
            }
          }

          $destination = Join-Path $env:GITHUB_WORKSPACE "release-desktop\stt\$env:BABYAI_STT_MODEL_NAME"
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($file in $requiredFiles) {
            Copy-Item (Join-Path $modelRoot $file) (Join-Path $destination $file) -Force
          }
          Write-Host "Bundled local STT model: $env:BABYAI_STT_MODEL_NAME (int8 encoder/decoder)"

      - name: Configure portable CPU native runtime
        shell: pwsh
        run: |
          $llama = Join-Path $env:GITHUB_WORKSPACE "external\llama.cpp"
          cmake -S native/BabyAI.NativeBridge -B native/build-release-cpu -A x64 "-DBABYAI_LLAMA_CPP_DIR=$llama" -DBABYAI_NATIVE_BACKEND=cpu -DBABYAI_NATIVE_CPU_PROFILE=portable

      - name: Build portable CPU native runtime
        shell: pwsh
        run: cmake --build native/build-release-cpu --config Release --target babyai_native --parallel 2

      - name: Configure AVX CPU native runtime
        shell: pwsh
        run: |
          $llama = Join-Path $env:GITHUB_WORKSPACE "external\llama.cpp"
          cmake -S native/BabyAI.NativeBridge -B native/build-release-cpu-avx -A x64 "-DBABYAI_LLAMA_CPP_DIR=$llama" -DBABYAI_NATIVE_BACKEND=cpu -DBABYAI_NATIVE_CPU_PROFILE=avx

      - name: Build AVX CPU native runtime
        shell: pwsh
        run: cmake --build native/build-release-cpu-avx --config Release --target babyai_native --parallel 2

      - name: Configure AVX2 CPU native runtime
        shell: pwsh
        run: |
          $llama = Join-Path $env:GITHUB_WORKSPACE "external\llama.cpp"
          cmake -S native/BabyAI.NativeBridge -B native/build-release-cpu-avx2 -A x64 "-DBABYAI_LLAMA_CPP_DIR=$llama" -DBABYAI_NATIVE_BACKEND=cpu -DBABYAI_NATIVE_CPU_PROFILE=avx2

      - name: Build AVX2 CPU native runtime
        shell: pwsh
        run: cmake --build native/build-release-cpu-avx2 --config Release --target babyai_native --parallel 2

      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkan_sdk.exe"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK"
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK SHA256 mismatch." }
          & $installer --root $sdkRoot --accept-licenses --default-answer --confirm-command install copy_only=1
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installer exited with code $LASTEXITCODE" }
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $sdkRoot "Bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Vulkan native runtime
        shell: pwsh
        run: |
          $llama = Join-Path $env:GITHUB_WORKSPACE "external\llama.cpp"
          cmake -S native/BabyAI.NativeBridge -B native/build-release-vulkan -A x64 "-DBABYAI_LLAMA_CPP_DIR=$llama" -DBABYAI_NATIVE_BACKEND=vulkan -DBABYAI_NATIVE_CPU_PROFILE=portable

      - name: Build Vulkan native runtime
        shell: pwsh
        run: cmake --build native/build-release-vulkan --config Release --target babyai_native --parallel 2

      - name: Assemble release bundle
        shell: pwsh
        run: |
          .\scripts\windows\build-release-bundle.ps1 `
            -Version $env:BABYAI_RELEASE_VERSION `
            -DesktopDir release-desktop `
            -WheelsDir release-wheels `
            -CpuRuntime native/build-release-cpu/Release/babyai_native.dll `
            -AvxRuntime native/build-release-cpu-avx/Release/babyai_native.dll `
            -Avx2Runtime native/build-release-cpu-avx2/Release/babyai_native.dll `
            -VulkanRuntime native/build-release-vulkan/Release/babyai_native.dll `
            -PythonRuntimeDir release-python `
            -OutputDir dist-release

      - name: Verify release bundle and installer
        shell: pwsh
        run: .\scripts\windows\verify-release-bundle.ps1 -Version $env:BABYAI_RELEASE_VERSION -OutputDir dist-release -Python python

      - name: Publish branded setup shell
        shell: pwsh
        run: |
          dotnet publish installer/BabyAI.Setup/BabyAI.Setup.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o installer-publish
          if (-not (Test-Path installer-publish/BabyAI-Setup.exe -PathType Leaf)) {
            throw "BabyAI-Setup.exe was not produced."
          }

      - name: Prepare pinned 7-Zip installer SFX module
        shell: pwsh
        run: |
          $compactVersion = $env:SEVEN_ZIP_LZMA_VERSION.Replace('.', '')
          $archive = Join-Path $env:RUNNER_TEMP "lzma$compactVersion.7z"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "lzma-sdk-$compactVersion"
          $url = "https://github.com/ip7z/7zip/releases/download/$env:SEVEN_ZIP_LZMA_VERSION/lzma$compactVersion.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:SEVEN_ZIP_LZMA_SHA256) { throw "LZMA SDK SHA256 mismatch." }
          & "$env:ProgramFiles\7-Zip\7z.exe" x -y $archive "-o$sdkRoot"
          if ($LASTEXITCODE -ne 0) { throw "7-Zip exited with code $LASTEXITCODE" }
          $sfx = Join-Path $sdkRoot "bin\7zSD.sfx"
          if (-not (Test-Path $sfx -PathType Leaf)) { throw "7zSD.sfx was not found." }
          "BABYAI_INSTALLER_SFX=$sfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build single EXE installer
        shell: pwsh
        run: |
          $bundle = "dist-release/BabyAI-$env:BABYAI_RELEASE_VERSION-windows-x64"
          $output = "dist-release/BabyAI-Setup-$env:BABYAI_RELEASE_VERSION.exe"
          .\scripts\windows\build-single-exe-installer.ps1 `
            -SetupExe installer-publish/BabyAI.Setup.exe `
            -BundleDir $bundle `
            -SfxModule $env:BABYAI_INSTALLER_SFX `
            -OutputExe $output
          if (-not (Test-Path $output -PathType Leaf)) { throw "Single EXE installer was not produced." }
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$output.sha256" "$hash  $([IO.Path]::GetFileName($output))" -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: BabyAI-Windows-Release-x64
          path: |
            dist-release/BabyAI-*-windows-x64.zip
            dist-release/BabyAI-*-windows-x64.zip.sha256
            dist-release/BabyAI-Setup-*.exe
            dist-release/BabyAI-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist-release/BabyAI-$env:BABYAI_RELEASE_VERSION-windows-x64.zip"
          $sha = "$zip.sha256"
          $setup = "dist-release/BabyAI-Setup-$env:BABYAI_RELEASE_VERSION.exe"
          $setupSha = "$setup.sha256"
          $releaseExists = $false
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          if ($releaseExists) {
            gh release upload $env:GITHUB_REF_NAME $zip $sha $setup $setupSha --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $zip $sha $setup $setupSha --title "BabyAI $env:GITHUB_REF_NAME" --generate-notes
          }
