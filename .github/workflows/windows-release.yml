name: Windows Release Bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "scripts/windows/build-release-bundle.ps1"
      - "scripts/windows/install-release.ps1"
      - "scripts/windows/start-release.ps1"
      - "desktop/**"
      - "src/**"
      - "native/**"
      - "pyproject.toml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VULKAN_SDK_VERSION: "1.4.350.0"
      VULKAN_SDK_SHA256: "855b27ba05d2d8119c5114c5d4ff870ca38f2c632b11e1bb9923b9b7e6ecfe7b"

    steps:
      - name: Checkout BabyAI
        uses: actions/checkout@v4

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: e79e4bf660e19f2ad851e06c6913f7a8c5852621
          path: external/llama.cpp
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve and verify release version
        shell: pwsh
        run: |
          $pyproject = Get-Content pyproject.toml -Raw
          $projectMatch = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $projectMatch.Success) { throw "Could not read project version." }
          $projectVersion = $projectMatch.Groups[1].Value

          $desktop = Get-Content desktop/BabyAI.Desktop/BabyAI.Desktop.csproj -Raw
          $desktopMatch = [regex]::Match($desktop, '<Version>([^<]+)</Version>')
          if (-not $desktopMatch.Success) { throw "Could not read desktop version." }
          $desktopVersion = $desktopMatch.Groups[1].Value

          if ($projectVersion -ne $desktopVersion) {
            throw "Version mismatch: Core=$projectVersion Desktop=$desktopVersion"
          }

          $version = $projectVersion
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v', 'V')
            if ($tagVersion -ne $projectVersion) {
              throw "Tag version $tagVersion does not match project version $projectVersion"
            }
            $version = $tagVersion
          }

          "BABYAI_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BabyAI release version: $version"

      - name: Build offline Core wheels
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-wheels | Out-Null
          python -m pip download . --dest release-wheels
          if (-not (Get-ChildItem release-wheels -Filter "babyai_core-*.whl" -File)) {
            throw "BabyAI Core wheel was not produced."
          }

      - name: Publish WinUI Desktop
        shell: pwsh
        run: |
          dotnet publish desktop/BabyAI.Desktop/BabyAI.Desktop.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o release-desktop
          if (-not (Test-Path release-desktop/BabyAI.Desktop.exe -PathType Leaf)) {
            throw "BabyAI.Desktop.exe was not produced."
          }

      - name: Configure CPU native runtime
        shell: pwsh
        run: |
          $llama = Join-Path $env:GITHUB_WORKSPACE "external\llama.cpp"
          cmake -S native/BabyAI.NativeBridge -B native/build-release-cpu -A x64 "-DBABYAI_LLAMA_CPP_DIR=$llama" -DBABYAI_NATIVE_BACKEND=cpu

      - name: Build CPU native runtime
        shell: pwsh
        run: cmake --build native/build-release-cpu --config Release --target babyai_native --parallel 2

      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkan_sdk.exe"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK"
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK SHA256 mismatch." }
          & $installer --root $sdkRoot --accept-licenses --default-answer --confirm-command install copy_only=1
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installer exited with code $LASTEXITCODE" }
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $sdkRoot "Bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Vulkan native runtime
        shell: pwsh
        run: |
          $llama = Join-Path $env:GITHUB_WORKSPACE "external\llama.cpp"
          cmake -S native/BabyAI.NativeBridge -B native/build-release-vulkan -A x64 "-DBABYAI_LLAMA_CPP_DIR=$llama" -DBABYAI_NATIVE_BACKEND=vulkan

      - name: Build Vulkan native runtime
        shell: pwsh
        run: cmake --build native/build-release-vulkan --config Release --target babyai_native --parallel 2

      - name: Assemble release bundle
        shell: pwsh
        run: |
          .\scripts\windows\build-release-bundle.ps1 `
            -Version $env:BABYAI_RELEASE_VERSION `
            -DesktopDir release-desktop `
            -WheelsDir release-wheels `
            -CpuRuntime native/build-release-cpu/Release/babyai_native.dll `
            -VulkanRuntime native/build-release-vulkan/Release/babyai_native.dll `
            -OutputDir dist-release

      - name: Verify release bundle
        shell: pwsh
        run: |
          $zip = Resolve-Path "dist-release/BabyAI-$env:BABYAI_RELEASE_VERSION-windows-x64.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "babyai-release-check"
          Expand-Archive $zip $expanded -Force
          $root = Join-Path $expanded "BabyAI-$env:BABYAI_RELEASE_VERSION-windows-x64"
          foreach ($required in @(
            "release.json",
            "SHA256SUMS.txt",
            "install.ps1",
            "start.ps1",
            "app/BabyAI.Desktop.exe",
            "runtime/cpu/babyai_native.dll",
            "runtime/vulkan/babyai_native.dll"
          )) {
            if (-not (Test-Path (Join-Path $root $required) -PathType Leaf)) {
              throw "Release bundle is missing $required"
            }
          }
          $manifest = Get-Content (Join-Path $root "release.json") -Raw | ConvertFrom-Json
          if ([string]$manifest.version -ne $env:BABYAI_RELEASE_VERSION) { throw "Release manifest version mismatch." }

      - uses: actions/upload-artifact@v4
        with:
          name: BabyAI-Windows-Release-x64
          path: |
            dist-release/BabyAI-*-windows-x64.zip
            dist-release/BabyAI-*-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist-release/BabyAI-$env:BABYAI_RELEASE_VERSION-windows-x64.zip"
          $sha = "$zip.sha256"
          gh release create $env:GITHUB_REF_NAME $zip $sha --title "BabyAI $env:GITHUB_REF_NAME" --generate-notes
