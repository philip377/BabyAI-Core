name: Extract PR159 Setup

on:
  pull_request:
    paths:
      - '.github/workflows/extract-pr159-setup.yml'

permissions:
  contents: read
  actions: read

jobs:
  extract-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing PR159 release artifact
        uses: actions/download-artifact@v4
        with:
          name: BabyAI-Windows-Release-x64
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34142379435

      - name: Locate setup executable
        shell: bash
        run: |
          set -euo pipefail
          setup=$(find release -maxdepth 2 -type f -name 'BabyAI-Setup-*.exe' -print -quit)
          test -n "$setup"
          mkdir -p setup-only
          cp "$setup" setup-only/UNIX-PR159-Durable-Jobs-Setup.exe
          ls -lh setup-only/UNIX-PR159-Durable-Jobs-Setup.exe

      - name: Upload setup only
        uses: actions/upload-artifact@v4
        with:
          name: UNIX-PR159-Durable-Jobs-Setup
          path: setup-only/UNIX-PR159-Durable-Jobs-Setup.exe
          compression-level: 0
          if-no-files-found: error
